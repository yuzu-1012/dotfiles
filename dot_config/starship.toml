# Starship config - EdenQwQ style with refined colors
"$schema" = 'https://starship.rs/config-schema.json'
palette = "noctalia"

add_newline = true

format = """
$directory\
$git_branch\
$git_status\
$fill\
$c\
$cpp\
$golang\
$java\
$nodejs\
$bun\
$python\
$rust\
$container\
$nix_shell\
$time\n\
$character \
"""


[palettes.custom]
base = '#1a181a'
mantle = '#121112'
surface0 = '#302c30'
surface1 = '#383238'
surface2 = '#403940'
overlay0 = '#666266'
overlay1 = '#716b71'
overlay2 = '#797279'
subtext0 = '#deddde'
subtext1 = '#e8e7e8'
text = '#f2f2f2'
love = '#b24355'
gold = '#a08783'
peach = '#c2725f'
rose = '#b44454'
pine = '#72636c'
foam = '#73626f'
iris = '#856a84'
sky = '#71646d'

[character]
format = "$symbol "
success_symbol = "[╰─ >](bold iris)"
error_symbol = "[╰─ >](bold love)"

[username]
disabled = false
format = "[╭─  $user ](fg:text) "
show_always = true
style_user = "fg:text"
style_root = "fg:love"

[directory]
format = "[╭─   $path ](fg:iris)"
style = "fg:iris"
truncation_length = 3
truncation_symbol = ".../"

[directory.substitutions]
Documents = "docs"
Downloads = "dl"
Pictures = "pics"

[fill]
style = "fg:surface1"
symbol = "·"

[git_branch]
format = "[ $symbol$branch ](fg:foam)"
style = "fg:foam"
symbol = " "

[git_status]
disabled = false
style = "fg:love"
format = '([$all_status$ahead_behind]($style))'
up_to_date = '[ 󰄬 ](fg:iris)'
untracked = '[  \($count\)](fg:gold)'
stashed = '[ 󰏗 ](fg:iris)'
modified = '[ 󰏫 \($count\)](fg:gold)'
renamed = '[ 󰑕 \($count\)](fg:iris)'
deleted = '[ 󰆴 \($count\)](fg:love)'
staged = '[ 󰐕 \($count\)](fg:gold)'
ahead = '[ 󰄥 \($count\)](fg:foam)'
diverged = '[ 󰹹 \($ahead_count\) 󰹺 \($behind_count\)](fg:rose)'
behind = '[ 󰄠 \($count\)](fg:rose)'

[time]
disabled = false
format = "[   $time ](fg:text) "
style = "fg:text"
time_format = "%H:%M"

[cmd_duration]
format = "[󱦟 $duration ](fg:overlay1)"

[c]
style = "fg:pine"
format = "[ $symbol$version ](fg:pine) "
symbol = " "

[cpp]
style = "fg:pine"
format = "[ $symbol$version ](fg:pine) "
symbol = " "

[golang]
style = "fg:pine"
format = "[ $symbol$version ](fg:pine) "
symbol = " "

[java]
style = "fg:pine"
format = "[ $symbol$version ](fg:pine) "
symbol = " "

[nodejs]
style = "fg:pine"
format = "[ $symbol$version ](fg:pine) "
symbol = " "

[bun]
style = "fg:pine"
format = "[ $symbol$version ](fg:pine) "
symbol = "🥟 "

[python]
style = "fg:pine"
format = "[ $symbol$version ](fg:pine) "
symbol = " "

[rust]
style = "fg:pine"
format = "[ $symbol$version ](fg:pine) "
symbol = " "

[docker_context]
style = "fg:pine"
format = "[ $symbol$context ](fg:pine) "
symbol = " "

[nix_shell]
format = 'via [$symbol$state]($style) '
symbol = " "
style = "bold foam"
impure_msg = "impure"
pure_msg = "pure"
unknown_msg = ""
disabled = false

[lua]
style = "fg:pine"
format = "[ $symbol$version ](fg:pine) "
symbol = " "

[ruby]
style = "fg:pine"
format = "[ $symbol$version ](fg:pine) "
symbol = " "

[deno]
style = "fg:pine"
format = "[ $symbol$version ](fg:pine) "
symbol = "🦕 "

[swift]
style = "fg:pine"
format = "[ $symbol$version ](fg:pine) "
symbol = " "

[elixir]
style = "fg:pine"
format = "[ $symbol$version ](fg:pine) "
symbol = " "

[elm]
style = "fg:pine"
format = "[ $symbol$version ](fg:pine) "
symbol = " "

[haskell]
style = "fg:pine"
format = "[ $symbol$version ](fg:pine) "
symbol = " "

[julia]
style = "fg:pine"
format = "[ $symbol$version ](fg:pine) "
symbol = " "

[nim]
style = "fg:pine"
format = "[ $symbol$version ](fg:pine) "
symbol = " "

[scala]
style = "fg:pine"
format = "[ $symbol$version ](fg:pine) "
symbol = " "

[conda]
style = "fg:pine"
format = "[ $symbol$environment ](fg:pine) "
symbol = " "

[package]
style = "fg:gold"
format = "[ $symbol$version ](fg:gold) "
symbol = "󰏗 "

[memory_usage]
disabled = false
format = "[󰍛 $ram ](fg:overlay1)"
style = "fg:overlay1"

[localip]
ssh_only = true
format = "[ip:$localipv4](fg:overlay1) "
disabled = false

[battery]
format = "[$percentage$symbol]($style)"
full_symbol = "="
charging_symbol = "+"
discharging_symbol = "-"
unknown_symbol = "?"
empty_symbol = "!"

[[battery.display]]
threshold = 20
style = "fg:love"

[[battery.display]]
threshold = 60
style = "fg:gold"

[env_var.VIMSHELL]
format = "[$env_value]($style)"
style = 'fg:foam'

[sudo]
format = "[$symbol]($style)"
style = "bold love"
symbol = "#"
disabled = false

[jobs]
format = "[$symbol$number]($style) "
style = "fg:iris"
symbol = "j:"

